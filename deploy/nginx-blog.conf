server {
    listen 80;
    listen [::]:80;
    server_name blog.awin-x.top;

    # Keep the ACME path usable in case the cert is ever moved to certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/blog;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.awin-x.top;

    # Auto-renewed DV cert (Tencent SSL -> ssl_auto_download.py).
    ssl_certificate     /etc/nginx/cert/blog.awin-x.top.pem;
    ssl_certificate_key /etc/nginx/cert/blog.awin-x.top.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blog;
    index index.html;

    # Static site: clean URLs map to directory index files.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Long-cache fingerprinted assets.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fresh-but-cacheable feeds and sitemaps.
    location ~ ^/(sitemap.*\.xml|rss\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML should revalidate so new posts appear promptly.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Basic hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript
        application/json image/svg+xml application/rss+xml;
}
