server {
    listen 80;
    listen [::]:80;
    server_name blog.awin-x.top;

    # Keep the ACME path usable in case the cert is ever moved to certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/blog;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.awin-x.top;

    # Auto-renewed DV cert (Tencent SSL -> ssl_auto_download.py).
    ssl_certificate     /etc/nginx/cert/blog.awin-x.top.pem;
    ssl_certificate_key /etc/nginx/cert/blog.awin-x.top.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blog;
    index index.html;

    # Dedicated access log so analytics only see this vhost.
    access_log /var/log/nginx/blog.access.log combined;

    # NOTE: caching uses `expires` (not `add_header`) throughout, because a
    # location-level `add_header` would reset inheritance and silently drop the
    # security headers below. Keeping add_header only at the server level makes
    # them apply to every response.

    # Static site: clean URLs map to directory index files.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Long-cache fingerprinted assets.
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Sitemaps: conventional /sitemap.xml alias + serve as application/xml.
    location = /sitemap.xml {
        types { application/xml xml; }
        try_files /sitemap-index.xml =404;
    }
    location ~ ^/sitemap.*\.xml$ {
        types { application/xml xml; }
        expires 1h;
    }
    location = /rss.xml {
        expires 1h;
    }
    location = /feed.json {
        expires 1h;
    }
    location = /robots.txt {
        expires 1h;
    }

    # HTML should revalidate so new posts appear promptly.
    location ~* \.html$ {
        expires -1;
    }

    # Security headers (server level; inherited by every location above).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript
        application/json image/svg+xml application/rss+xml;
}
