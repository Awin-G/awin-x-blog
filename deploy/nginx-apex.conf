# Apex awin-x.top — installed on TOWER at /etc/nginx/sites-available/apex
# (symlinked into sites-enabled). Kept here for the record; the deploy script
# only syncs the blog vhost automatically, so apply this one by hand.
#
# Why it exists: Google AdSense verifies the ROOT domain. The apex must be
# publicly reachable and must serve /ads.txt. Everything else 301s to the blog
# so there is exactly one canonical host (no duplicate content).
#
# DNS: @ A -> 88.218.79.95 (was 10.126.126.1, the EasyTier overlay address).
# TLS: /etc/nginx/cert/awin-x.top.pem, issued by the box's own SSL automation.

server {
    listen 80;
    listen [::]:80;
    server_name awin-x.top;

    location /.well-known/acme-challenge/ {
        root /var/www/blog;
    }

    location = /ads.txt {
        alias /var/www/blog/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        alias /var/www/blog/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 301 https://blog.awin-x.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name awin-x.top;

    ssl_certificate     /etc/nginx/cert/awin-x.top.pem;
    ssl_certificate_key /etc/nginx/cert/awin-x.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ads.txt {
        alias /var/www/blog/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        alias /var/www/blog/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 301 https://blog.awin-x.top$request_uri;
    }
}
