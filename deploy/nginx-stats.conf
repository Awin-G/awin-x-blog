server {
    listen 80;
    listen [::]:80;
    server_name stats.awin-x.top;

    location /.well-known/acme-challenge/ {
        root /var/www/stats;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.awin-x.top;

    ssl_certificate     /etc/letsencrypt/live/stats.awin-x.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.awin-x.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # GoatCounter's own dashboard is password-protected; keep it private-ish.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
