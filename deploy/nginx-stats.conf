server {
    listen 80;
    listen [::]:80;
    server_name stats.awin-x.top;

    location /.well-known/acme-challenge/ {
        root /var/www/stats;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.awin-x.top;

    ssl_certificate     /etc/letsencrypt/live/stats.awin-x.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.awin-x.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Server-side analytics report (GoAccess), generated on a timer.
    root /var/www/stats;
    index index.html;

    # Private: only the operator (and the agent, over SSH) read this.
    auth_basic "awin-x stats";
    auth_basic_user_file /etc/nginx/.htpasswd-blog-stats;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.json$ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
